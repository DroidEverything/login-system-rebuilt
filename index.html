<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">
    <div class="auth-card auth-card-split">
        <div class="auth-banner">
            <div class="banner-content">
                <h2>Lab Portal</h2>
                <p>Sign in to access your dashboard, review activity, and manage your account.</p>
            </div>
        </div>

        <div class="auth-form-area">
            <h1>Welcome Back</h1>
            <p class="subtitle">Please login to your account</p>

            <form action="dashboard.html" method="get">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="yourmail@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <div class="form-row">
                    <label class="checkbox"><input type="checkbox" name="remember"> Remember me</label>
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="btn">Login</button>
            </form>

            <p class="switch-text">Don't have an account? <a href="register.html">Register</a></p>
        </div>
    </div>
</body>
</html>
